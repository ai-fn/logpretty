name: Bug report
description: logpretty printed, hid or refused something it should not have
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The whole pipeline, with every flag given to logpretty.
      render: shell
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Log lines
      description: A line or two that show the problem, exactly as the program got them. Take the secrets out first.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What `logpretty --version` prints.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System, shell and terminal
      placeholder: macOS 15, zsh, iTerm2
    validations:
      required: true
