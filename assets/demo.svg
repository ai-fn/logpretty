<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 681 210" width="681" height="210" role="img" aria-label="logpretty output in a terminal">
  <title>logpretty output in a terminal</title>
  <rect width="681" height="210" rx="8" fill="#0d1117"/>
  <path d="M0 8a8 8 0 0 1 8-8h665a8 8 0 0 1 8 8v20H0z" fill="#161b22"/>
  <rect x=".5" y=".5" width="680" height="209" rx="7.5" fill="none" stroke="#30363d"/>
  <circle cx="20" cy="14" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="14" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="14" r="6" fill="#27c93f"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e6edf3" xml:space="preserve" style="white-space: pre">
    <text x="20" y="56"><tspan fill="#8b949e">$</tspan>&#160;logpretty&#160;-utc&#160;&lt;&#160;app.log</text>
    <text x="20" y="78"><tspan fill="#8b949e">12:00:00.123</tspan>&#160;<tspan fill="#3fb950">INFO</tspan>&#160;&#160;server&#160;started&#160;&#160;<tspan fill="#8b949e">port=</tspan>8080</text>
    <text x="20" y="100"><tspan fill="#8b949e">12:00:00.456</tspan>&#160;<tspan fill="#39c5cf">DEBUG</tspan>&#160;cache&#160;miss&#160;&#160;<tspan fill="#8b949e">key=</tspan>user:42</text>
    <text x="20" y="122"><tspan fill="#8b949e">12:00:01.000</tspan>&#160;<tspan fill="#d29922">WARN</tspan>&#160;&#160;slow&#160;request&#160;&#160;<tspan fill="#8b949e">latency=</tspan>1.2s&#160;<tspan fill="#8b949e">path=</tspan>/api/v1/users</text>
    <text x="20" y="144"><tspan fill="#8b949e">web-1&#160;&#160;|</tspan>&#160;<tspan fill="#8b949e">12:00:02.000</tspan>&#160;<tspan fill="#f85149">ERROR</tspan>&#160;query&#160;failed&#160;&#160;<tspan fill="#8b949e">db=</tspan>{"host":"pg-1","retries":3}</text>
    <text x="20" y="166"><tspan fill="#8b949e">12:00:03.000</tspan>&#160;<tspan fill="#ff7b72" font-weight="bold">FATAL</tspan>&#160;out&#160;of&#160;memory&#160;&#160;<tspan fill="#8b949e">rss=</tspan>2.1GiB</text>
    <text x="20" y="188">panic:&#160;runtime&#160;error:&#160;index&#160;out&#160;of&#160;range&#160;[5]&#160;with&#160;length&#160;3</text>
